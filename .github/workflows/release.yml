name: Build and publish both apps

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Mac app and Windows companion
        run: ./Windows/build-windows.sh
      - name: Package downloads
        run: |
          ditto -c -k --keepParent 'dist/MX Control.app' dist/MX-Control-macOS-arm64.zip
          cd dist
          shasum -a 256 MX-Control-macOS-arm64.zip MXControlPC.exe > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --title "KeyBridge Mac to PC $RELEASE_TAG" \
            --notes 'Download both apps from this release and follow the setup in the repository README.' \
            dist/MX-Control-macOS-arm64.zip dist/MXControlPC.exe dist/SHA256SUMS.txt
