name: Build and publish both apps

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Mac app and Windows companion
        run: VERSION="${GITHUB_REF_NAME#v}" ./Windows/build-windows.sh
      - name: Package downloads
        run: |
          ditto -c -k --keepParent dist/Keybridge.app dist/Keybridge-macOS-arm64.zip
          cd dist
          shasum -a 256 Keybridge-macOS-arm64.zip KeyBridge-Control-PC.exe > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --latest --title "Keybridge $RELEASE_TAG" \
            --notes-file RELEASE_NOTES.md \
            dist/Keybridge-macOS-arm64.zip dist/KeyBridge-Control-PC.exe dist/SHA256SUMS.txt
